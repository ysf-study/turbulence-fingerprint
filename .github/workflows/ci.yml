name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: tests and reference check (python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Optional: enables the five feature-extraction tests.  Kept in its own
      # step and allowed to fail so that a missing OpenCV wheel for this
      # interpreter cannot mask the results of the other tests.
      - name: Install OpenCV for the feature tests (optional)
        continue-on-error: true
        run: pip install -r requirements-features.txt

      - name: Integrity and reference check (no training)
        run: python scripts/verify_release.py

      - name: Tests
        run: pytest -q

      - name: Full reproduction, then diff against the reference outputs
        run: |
          python src/train_eval.py --out /tmp/out
          python src/ablation.py --out /tmp/out
          python src/fusion_eval.py --out /tmp/out
          python scripts/compare_reference.py /tmp/out results/reference

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check src scripts tests

  metadata:
    name: citation and zenodo metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CITATION.cff and .zenodo.json parse as YAML/JSON
        run: |
          pip install pyyaml
          python - <<'PY'
          import json, pathlib, yaml
          yaml.safe_load(pathlib.Path("CITATION.cff").read_text(encoding="utf-8"))
          json.loads(pathlib.Path(".zenodo.json").read_text(encoding="utf-8"))
          print("metadata parses")
          PY
